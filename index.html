<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>DRAGON BALL RADAR</title>
  <meta name="theme-color" content="#1b1540">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Relic Finder">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="device" aria-label="Relic Finder">
    <header class="topbar">
      <div class="brand">
        <span class="led" id="led" aria-hidden="true"></span>
        <span class="wordmark">DRAGON BALL RADAR</span>
        <span class="badge" id="badge">2026</span>
      </div>
      <div class="pips" id="pips" aria-label="Relics found"></div>
    </header>

    <section class="bezel">
      <div class="screen" id="screen">
        <canvas id="radar" aria-label="Radar display"></canvas>
        <div class="scanlines" aria-hidden="true"></div>
        <div class="glare" aria-hidden="true"></div>
        <button class="boot" id="boot" type="button" aria-label="Power on">
          <div class="boot-lines" id="bootLines"></div>
        </button>
      </div>
    </section>

    <section class="lcd" aria-live="polite">
      <div class="cell"><span class="k">DIST</span><span class="v" id="vDist">—</span></div>
      <div class="cell"><span class="k">HDG</span><span class="v" id="vHdg">—</span></div>
      <div class="cell"><span class="k">ACC</span><span class="v" id="vAcc">—</span></div>
      <div class="cell"><span class="k">RELICS</span><span class="v" id="vRelics">0/0</span></div>
    </section>

    <section class="clue">
      <span class="clue-k">▸ TRANSMISSION</span>
      <p class="clue-v" id="clue">Standing by.</p>
    </section>

    <footer class="controls">
      <div class="btn-wrap">
        <button class="btn" id="btnRange" type="button"></button>
        <span class="btn-label">RANGE <b id="lRange">AUTO</b></span>
      </div>
      <div class="btn-wrap">
        <button
